name: Documentation

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]
    
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # --- LINTING SETUP ---
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install linters
        run: npm install -g markdownlint-cli cspell html-validate
        
       # --- VALE ---
      - name: Run Vale
        uses: errata-ai/vale-action@v2
        with:
          files: docs

      - name: Lint Markdown
        run: markdownlint -c .markdownlint.jsonc "docs/**/*.md"

      - name: Spell check
        run: cspell "docs/**/*.md"
        
      # --- GRAMMAR CHECK (LanguageTool) ---
      - name: Start LanguageTool server
        run: |
          docker run -d -p 8010:8010 --name languagetool silviof/docker-languagetool

      - name: Wait for LanguageTool
        run: |
          for i in {1..15}; do
            curl -s http://localhost:8010/v2/languages && echo "Ready" && exit 0
            echo "Waiting for LanguageTool..."
            sleep 3
          done
          echo "LanguageTool failed to start" && exit 1

      - name: Install jq (JSON parser)
        run: sudo apt-get install -y jq

      - name: Grammar check Markdown files
        run: |
          set -e

          for file in $(find docs -name "*.md"); do
            echo "Checking $file"

            text=$(cat "$file" \
              | perl -0777 -pe 's/^---.*?---\s*//sm' \
              | perl -0777 -pe 's/```.*?```//sg' \
              | perl -pe 's/`[^`]+`//g' \
              | perl -pe 's!\[([^\]]+)\]\([^)]+\)!\1!g' \
              | perl -pe 's!https?://\S+!!g')

            response=$(curl -s -X POST "http://localhost:8010/v2/check" \
              -d "language=en-GB" \
              --data-urlencode "text=$text" \
              -d "disabledRules=MORFOLOGIK_RULE_EN_GB")

            grammar_issues=$(echo "$response" | jq -r '
              .matches[]
                | select(
                    .rule.id
                    | test("^(EN_A_VS_AN|AGREEMENT|MISSING|VERB|SENTENCE_FRAGMENT|DOUBLE_NEGATION)")
                  )
            ')

            if echo "$grammar_issues" | grep -q .; then
              echo "❌ Grammar issues found in $file"

              echo "$response" | jq '
                .matches[]
                | select(
                    .rule.id
                    | test("^(EN_A_VS_AN|AGREEMENT|MISSING|VERB|SENTENCE_FRAGMENT|DOUBLE_NEGATION)")
                  )
                | {rule: .rule.id, message, context: .context.text}
              '

              exit 1
            fi
          done

      # --- PYTHON / BUILD ---
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build site
        run: python -m zensical build --clean --strict
       
      # Commented this out as the output from Zensical fails it for multiple reasons 
      # - name: Validate HTML output
      #   run: |
      #    html-validate site/**/*.html --formatter stylish

      - name: Verify build output
        run: |
          echo "=== BUILD OUTPUT ==="
          ls -R site
          test -f site/index.html || (echo "❌ Missing index.html" && exit 1)

      - name: Disable Jekyll
        run: touch site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deployment