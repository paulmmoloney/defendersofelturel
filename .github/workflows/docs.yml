name: Documentation

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # --- LINTING SETUP ---
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install linters
        run: npm install -g markdownlint-cli cspell html-validate
        
       # --- VALE ---
      - name: Install Vale
        run: |
          wget https://github.com/errata-ai/vale/releases/latest/download/vale_Linux_64-bit.tar.gz
          tar -xzf vale_Linux_64-bit.tar.gz
          sudo mv vale /usr/local/bin/

      - name: Run Vale
        run: vale docs

      - name: Lint Markdown
        run: markdownlint -c .markdownlint.jsonc "docs/**/*.md"

      - name: Spell check
        run: cspell "docs/**/*.md"
        
        
      # --- PYTHON / BUILD ---
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build site
        run: python -m zensical build --clean --strict
       
      # Commented this out as the output from Zensical fails it for multiple reasons 
      # - name: Validate HTML output
      #   run: |
      #    html-validate site/**/*.html --formatter stylish

      - name: Verify build output
        run: |
          echo "=== BUILD OUTPUT ==="
          ls -R site
          test -f site/index.html || (echo "❌ Missing index.html" && exit 1)

      - name: Disable Jekyll
        run: touch site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deployment