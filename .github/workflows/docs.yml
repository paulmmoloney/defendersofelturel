name: Documentation

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # --- LINTING SETUP ---
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install linters
        run: npm install -g markdownlint-cli cspell

      - name: Lint Markdown
        run: markdownlint -c .markdownlint.jsonc "docs/**/*.md"

      - name: Spell check
        run: cspell "docs/**/*.md"

      # --- PYTHON / BUILD ---
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt
        
              
      - name: Install Lychee link checker
        run: |
          curl -sSfL https://github.com/lycheeverse/lychee/releases/latest/download/lychee-x86_64-unknown-linux-gnu.tar.gz \
          | tar -xz
          sudo mv lychee /usr/local/bin/

      - name: Build site
        run: python -m zensical build --clean

      - name: Verify build output
        run: |
          echo "=== BUILD OUTPUT ==="
          ls -R site
          test -f site/index.html || (echo "❌ Missing index.html" && exit 1)
          
      - name: Start local web server
        run: |
          python -m http.server 8000 --directory site &
          sleep 5**

      - name: Check links
        run: |
          lychee \
            --verbose \
            --no-progress \
            --accept 200,429 \
            --exclude-mail \
            http://127.0.0.1:8000

      - name: Disable Jekyll
        run: touch site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deployment